<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background squircle clip/fill -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#084B8A" />
      <stop offset="30%" stop-color="#0D69AB" />
      <stop offset="65%" stop-color="#27AE60" />
      <stop offset="100%" stop-color="#2ECC71" />
    </linearGradient>

    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E354D" />
      <stop offset="50%" stop-color="#2A4766" />
      <stop offset="100%" stop-color="#1E354D" />
    </linearGradient>

    <linearGradient id="finGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#132435" />
      <stop offset="50%" stop-color="#375A7F" />
      <stop offset="100%" stop-color="#182B3E" />
    </linearGradient>

    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>

    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Canvas Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="#FFFFFF" />

  <!-- Circular Ring Frame -->
  <circle cx="256" cy="205" r="152" fill="none" stroke="url(#ringGrad)" stroke-width="16" />

  <!-- Isometric Ground / Field in bottom of circle -->
  <g clip-path="url(#circleClip)">
    <clipPath id="circleClip">
      <circle cx="256" cy="205" r="144" />
    </clipPath>
    <!-- Background sky inside circle -->
    <rect x="100" y="50" width="312" height="310" fill="#EDF4F9" />

    <!-- Green Land Polygon -->
    <polygon points="130,305 256,255 382,305 256,355" fill="#43A047" />
    <!-- Grid segments -->
    <polygon points="256,255 210,273 256,291 302,273" fill="#4CAF50" />
    <polygon points="210,273 165,291 210,310 256,291" fill="#388E3C" />
    <polygon points="302,273 256,291 302,310 348,291" fill="#66BB6A" />
    <polygon points="256,291 210,310 256,330 302,310" fill="#43A047" />
    <polygon points="210,310 165,328 210,348 256,330" fill="#2E7D32" />
    <polygon points="302,310 256,330 302,348 348,328" fill="#4CAF50" />
    
    <!-- White grid lines -->
    <line x1="256" y1="255" x2="256" y2="355" stroke="#FFFFFF" stroke-width="2.5" opacity="0.7" />
    <line x1="210" y1="273" x2="302" y2="310" stroke="#FFFFFF" stroke-width="2" opacity="0.7" />
    <line x1="165" y1="291" x2="348" y2="328" stroke="#FFFFFF" stroke-width="2" opacity="0.7" />
    <line x1="302" y1="273" x2="210" y2="310" stroke="#FFFFFF" stroke-width="2" opacity="0.7" />
    <line x1="348" y1="291" x2="165" y2="328" stroke="#FFFFFF" stroke-width="2" opacity="0.7" />
  </g>

  <!-- ==================== DISTRIBUTION TRANSFORMER (LEFT) ==================== -->
  <g id="transformer" filter="url(#dropShadow)">
    <!-- Conservator Tank (Top cylinder) -->
    <ellipse cx="152" cy="124" rx="10" ry="16" fill="#1B2E42" />
    <rect x="152" y="108" width="34" height="32" fill="#2B4663" />
    <ellipse cx="186" cy="124" rx="10" ry="16" fill="#3B5B7E" />
    <!-- Conservator Pipe -->
    <path d="M 175 140 L 175 152 L 185 152" fill="none" stroke="#1B2E42" stroke-width="6" stroke-linecap="round" />

    <!-- Bushings (3 High Voltage Insulators on top of tank) -->
    <!-- Bushing 1 -->
    <g transform="translate(195, 120)">
      <line x1="0" y1="0" x2="0" y2="-12" stroke="#78909C" stroke-width="3" stroke-linecap="round" />
      <ellipse cx="0" cy="0" rx="6" ry="3" fill="#263238" />
      <ellipse cx="0" cy="6" rx="7" ry="3.5" fill="#37474F" />
      <ellipse cx="0" cy="13" rx="8" ry="4" fill="#263238" />
      <ellipse cx="0" cy="20" rx="9" ry="4.5" fill="#37474F" />
      <rect x="-4" y="22" width="8" height="8" fill="#1A252C" />
    </g>
    <!-- Bushing 2 -->
    <g transform="translate(225, 125)">
      <line x1="0" y1="0" x2="0" y2="-12" stroke="#78909C" stroke-width="3" stroke-linecap="round" />
      <ellipse cx="0" cy="0" rx="6" ry="3" fill="#263238" />
      <ellipse cx="0" cy="6" rx="7" ry="3.5" fill="#37474F" />
      <ellipse cx="0" cy="13" rx="8" ry="4" fill="#263238" />
      <ellipse cx="0" cy="20" rx="9" ry="4.5" fill="#37474F" />
      <rect x="-4" y="22" width="8" height="8" fill="#1A252C" />
    </g>
    <!-- Bushing 3 -->
    <g transform="translate(255, 133)">
      <line x1="0" y1="0" x2="0" y2="-12" stroke="#78909C" stroke-width="3" stroke-linecap="round" />
      <ellipse cx="0" cy="0" rx="6" ry="3" fill="#263238" />
      <ellipse cx="0" cy="6" rx="7" ry="3.5" fill="#37474F" />
      <ellipse cx="0" cy="13" rx="8" ry="4" fill="#263238" />
      <ellipse cx="0" cy="20" rx="9" ry="4.5" fill="#37474F" />
      <rect x="-4" y="22" width="8" height="8" fill="#1A252C" />
    </g>

    <!-- Main Tank Top Cover -->
    <polygon points="130,152 245,152 250,158 126,158" fill="#34495E" />
    <rect x="126" y="156" width="124" height="8" rx="2" fill="#1F2D3D" />

    <!-- Cooling Radiator Fins (Left side of tank) -->
    <g>
      <rect x="126" y="164" width="10" height="82" rx="2" fill="url(#finGrad1)" stroke="#111E29" stroke-width="0.5" />
      <rect x="138" y="164" width="10" height="82" rx="2" fill="url(#finGrad1)" stroke="#111E29" stroke-width="0.5" />
      <rect x="150" y="164" width="10" height="82" rx="2" fill="url(#finGrad1)" stroke="#111E29" stroke-width="0.5" />
      <rect x="162" y="164" width="10" height="82" rx="2" fill="url(#finGrad1)" stroke="#111E29" stroke-width="0.5" />
      <rect x="174" y="164" width="10" height="82" rx="2" fill="url(#finGrad1)" stroke="#111E29" stroke-width="0.5" />
    </g>

    <!-- Tank Body Right/Front Panel -->
    <rect x="184" y="164" width="64" height="82" fill="#22384D" />
    <!-- Tank Bottom Base -->
    <rect x="124" y="246" width="128" height="12" rx="3" fill="#14202C" />

    <!-- DTR Rating Plaque on Front -->
    <g transform="translate(190, 172)">
      <rect width="52" height="66" rx="6" fill="url(#plateGrad)" stroke="#CBD5E1" stroke-width="1.5" />
      <!-- Small screw dots on plaque -->
      <circle cx="5" cy="5" r="1.5" fill="#94A3B8" />
      <circle cx="47" cy="5" r="1.5" fill="#94A3B8" />
      <circle cx="5" cy="61" r="1.5" fill="#94A3B8" />
      <circle cx="47" cy="61" r="1.5" fill="#94A3B8" />
      
      <!-- Plaque Text: DTR -->
      <text x="26" y="26" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="900" fill="#0F253E" text-anchor="middle" letter-spacing="1">DTR</text>
      <!-- Lightning Bolt on Plaque -->
      <polygon points="27,33 21,46 26,46 24,56 32,43 27,43" fill="#0D47A1" />
    </g>
  </g>

  <!-- ==================== SURVEY CLIPBOARD (RIGHT) ==================== -->
  <g id="clipboard" filter="url(#dropShadow)">
    <!-- Navy Clipboard Base -->
    <rect x="268" y="112" width="120" height="164" rx="14" fill="#0D2847" stroke="#1B3D66" stroke-width="2" />

    <!-- Top Metal Clip -->
    <path d="M 314 112 L 314 105 A 14 14 0 0 1 342 105 L 342 112 Z" fill="none" stroke="#1976D2" stroke-width="4" />
    <rect x="306" y="104" width="44" height="16" rx="4" fill="#1976D2" stroke="#0D47A1" stroke-width="1" />
    <circle cx="328" cy="112" r="3.5" fill="#FFFFFF" />

    <!-- White Survey Sheet -->
    <rect x="276" y="128" width="104" height="140" rx="6" fill="#FFFFFF" />

    <!-- Header: SURVEY -->
    <text x="328" y="149" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="900" fill="#0C2B4E" text-anchor="middle" letter-spacing="1">SURVEY</text>

    <!-- Checklist Item 1 -->
    <g transform="translate(284, 157)">
      <rect width="17" height="17" rx="3" fill="none" stroke="#22C55E" stroke-width="2" />
      <path d="M 3.5 8.5 L 7 12 L 13.5 4.5" fill="none" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Blue survey line -->
      <line x1="24" y1="6" x2="82" y2="6" stroke="#64B5F6" stroke-width="3" stroke-linecap="round" />
      <line x1="24" y1="13" x2="65" y2="13" stroke="#90CAF9" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Checklist Item 2 -->
    <g transform="translate(284, 182)">
      <rect width="17" height="17" rx="3" fill="none" stroke="#22C55E" stroke-width="2" />
      <path d="M 3.5 8.5 L 7 12 L 13.5 4.5" fill="none" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="24" y1="6" x2="82" y2="6" stroke="#64B5F6" stroke-width="3" stroke-linecap="round" />
      <line x1="24" y1="13" x2="65" y2="13" stroke="#90CAF9" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Checklist Item 3 -->
    <g transform="translate(284, 207)">
      <rect width="17" height="17" rx="3" fill="none" stroke="#22C55E" stroke-width="2" />
      <path d="M 3.5 8.5 L 7 12 L 13.5 4.5" fill="none" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="24" y1="6" x2="82" y2="6" stroke="#64B5F6" stroke-width="3" stroke-linecap="round" />
      <line x1="24" y1="13" x2="65" y2="13" stroke="#90CAF9" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Checklist Item 4 -->
    <g transform="translate(284, 232)">
      <rect width="17" height="17" rx="3" fill="none" stroke="#22C55E" stroke-width="2" />
      <path d="M 3.5 8.5 L 7 12 L 13.5 4.5" fill="none" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="24" y1="6" x2="82" y2="6" stroke="#64B5F6" stroke-width="3" stroke-linecap="round" />
      <line x1="24" y1="13" x2="65" y2="13" stroke="#90CAF9" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- ==================== BLUE MAP LOCATION PIN (CENTER) ==================== -->
  <g id="mapPin" filter="url(#dropShadow)">
    <path d="M 256 226 C 240 226 228 238 228 254 C 228 274 256 308 256 308 C 256 308 284 274 284 254 C 284 238 272 226 256 226 Z" fill="url(#pinGrad)" stroke="#FFFFFF" stroke-width="3" />
    <!-- White Inner Circle -->
    <circle cx="256" cy="254" r="10" fill="#FFFFFF" />
  </g>

  <!-- ==================== BRANDING TEXT ==================== -->
  <!-- DTR -->
  <text x="256" y="396" font-family="DejaVu Sans, Arial, sans-serif" font-size="68" font-weight="900" fill="#0A3464" text-anchor="middle" letter-spacing="-1">DTR</text>

  <!-- SURVEY with flanked accent rules -->
  <g transform="translate(0, 424)">
    <line x1="108" y1="0" x2="158" y2="0" stroke="#0E64A8" stroke-width="4" stroke-linecap="round" />
    <text x="256" y="6" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="900" fill="#0A3464" text-anchor="middle" letter-spacing="6">SURVEY</text>
    <line x1="354" y1="0" x2="404" y2="0" stroke="#22C55E" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Pill Banner: DATA • TRACK • REPORT -->
  <g transform="translate(256, 466)">
    <rect x="-132" y="-16" width="264" height="30" rx="15" fill="#0A294E" />
    
    <text x="-80" y="4" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">DATA</text>
    <circle cx="-42" cy="0" r="2.5" fill="#22C55E" />

    <text x="0" y="4" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">TRACK</text>
    <circle cx="42" cy="0" r="2.5" fill="#22C55E" />

    <text x="80" y="4" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">REPORT</text>
  </g>

</svg>